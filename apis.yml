aid: ceezer
name: CEEZER
description: 'CEEZER (CEEZER Software GmbH) is a Berlin-based climate-tech enterprise platform for the
  procurement and portfolio management of carbon credits, Energy Attribute Certificates (EACs), and
  Sustainable Aviation Fuel Certificates (SAFc). The platform gives corporate sustainability teams
  access to a marketplace of more than 10,000 global carbon projects with transparent pricing and
  volume data, a proprietary risk-assessment engine ("Prism") that evaluates hundreds of validated
  data points per project, and audit-ready reporting for net-zero and decarbonization commitments.
  CEEZER combines expert climate advisory with enterprise-grade technology to help buyers plan,
  procure, and manage climate performance assets. Surfaced as a portfolio company of HV Capital and
  added to the API Evangelist network; the company operates a customer-facing web application but does
  not publish a public developer API or documentation at this time.'
